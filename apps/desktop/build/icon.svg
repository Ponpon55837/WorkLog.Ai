<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Work Intelligence</title>
  <defs>
    <linearGradient id="background" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f7de1"/>
      <stop offset="1" stop-color="#0e9fa3"/>
    </linearGradient>
  </defs>
  <!-- Rounded square, inset by the 100 px transparent margin of the macOS icon grid. -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#background)"/>
  <!-- A timeline: three log lines hanging off one rail. -->
  <path d="M296 352V672" stroke="#ffffff" stroke-opacity="0.45" stroke-width="22" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="296" cy="352" r="42"/>
    <circle cx="296" cy="512" r="42" fill="#e1eef8"/>
    <circle cx="296" cy="672" r="42" fill="#c3e0ee"/>
    <rect x="388" y="326" width="190" height="52" rx="26"/>
    <rect x="388" y="486" width="340" height="52" rx="26" fill-opacity="0.85"/>
    <rect x="388" y="646" width="200" height="52" rx="26" fill-opacity="0.7"/>
  </g>
  <!-- The spark: the insight drawn out of the log. -->
  <path fill="#ffe27a" d="M728 232 C742 308 770 336 846 350 C770 364 742 392 728 468 C714 392 686 364 610 350 C686 336 714 308 728 232Z"/>
</svg>
