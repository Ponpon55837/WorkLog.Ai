name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the primary Windows platform plus the macOS and Linux environments.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.16.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --prod --audit-level high

      # Before pnpm build, as in the release job: the plugin bundle must not depend on the workspace dist folders.
      - name: Plugin bundle from a fresh checkout
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build:plugin

      # Workspace packages resolve each other through dist/, so build before testing.
      - run: pnpm build

      # Prints the SQLite bundled with this Node.js and fails when it has the WAL-reset corruption bug.
      - name: Check bundled SQLite version
        run: node scripts/check-sqlite-version.mjs

      - name: Verify production backup worker build
        run: pnpm run verify:backup-worker-build

      # Builds the checkout-free package, unpacks the tarball and runs it with a temporary HOME on a free port.
      - name: Standalone package smoke test
        run: pnpm run test:standalone

      # The real `pnpm start` entry (scripts/start.mjs) on a temporary database and free port; E2E no longer covers it.
      - name: Start entry smoke test
        run: pnpm run test:start-smoke

      # The coverage run executes the same test files as pnpm test, so each OS runs the suite once:
      # Ubuntu runs lint + format:check + coverage, Windows and macOS run pnpm test (lint + format:check + tests).
      - name: Lint and format
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint && pnpm format:check

      - name: Unit and integration tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test

      # Windows PowerShell 5.1 under Constrained Language Mode (the machine-level lockdown policy): tier one of the ACL
      # check must report it by exit code and tier two (Get-Acl) must read the descriptors. The variable is removed
      # again even when the test fails.
      - name: Windows ACL check under Constrained Language Mode
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: packages/desktop-core
        env:
          WI_ACL_CLM_TEST: "1"
        run: |
          $code = 1
          try {
            [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', '4', 'Machine')
            pnpm exec vitest run --root ../.. --config packages/desktop-core/vitest.config.ts tests/desktop-core/runtime-windows-acl.test.ts -t "Constrained Language Mode"
            $code = $LASTEXITCODE
          } finally {
            [Environment]::SetEnvironmentVariable('__PSLockdownPolicy', $null, 'Machine')
          }
          exit $code

      - run: pnpm typecheck

      - name: Unit and integration tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage

      - name: Performance regression gates
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:performance

      - name: Retrieval quality regression
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:retrieval-quality

      - name: MCP response-size budgets
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:response-size

      - name: Recall evaluator synthetic smoke test
        run: pnpm run test:recall-eval:example

  # The storage suite on the newest Node line: node:sqlite and its bundled SQLite change between
  # majors (Node 26 exposed FTS5 tombstone rowids above 2^53 to StatementSync.run()).
  storage-node-next:
    name: Storage (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.16.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Prints the SQLite bundled with this Node.js and fails when it has the WAL-reset corruption bug.
      - name: Check bundled SQLite version
        run: node scripts/check-sqlite-version.mjs

      - run: pnpm --filter @work-intelligence/storage test

  # DT-07: multi-process WAL write + checkpoint stress (integrity_check, snapshot and restore comparison). Evidence next
  # to, never instead of, the SQLite version check above. Not part of `pnpm test`; the vitest suite runs the workers from
  # the TypeScript sources, so no build is needed. Only correctness is asserted; SQLITE_BUSY counts are just reported.
  sqlite-stress:
    name: SQLite stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.16.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The stress workers import the workspace packages' built output (e.g. @work-intelligence/shared/dist).
      - run: pnpm build

      - name: SQLite WAL stress
        run: pnpm test:sqlite-stress

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqlite-stress-${{ matrix.os }}
          path: perf-results/sqlite-stress-*.json
          if-no-files-found: warn
          retention-days: 14

  # One job per browser so the three Playwright projects run in parallel and alongside the quality matrix.
  e2e-browser:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.16.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # Builds production packages, then runs Playwright against an isolated temp SQLite.
      # A failed browser project is rerun once from scratch (scripts/run-e2e.mjs).
      - run: pnpm test:e2e
        env:
          E2E_PROJECTS: ${{ matrix.browser }}

      # Also keep the first attempt's traces when a rerun made the job pass.
      - if: failure() || hashFiles('test-results/*-rerun-*/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # Keeps the required status check name stable for branch protection.
  e2e:
    name: E2E (Chromium + Firefox + WebKit)
    runs-on: ubuntu-latest
    needs: e2e-browser
    if: always()
    steps:
      - name: Require every browser job to pass
        run: test "${{ needs.e2e-browser.result }}" = "success"
