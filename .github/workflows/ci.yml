name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the primary Windows platform plus the macOS and Linux environments.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --prod --audit-level high

      # Before pnpm build, as in the release job: the plugin bundle must not depend on the workspace dist folders.
      - name: Plugin bundle from a fresh checkout
        if: matrix.os == 'ubuntu-latest'
        run: pnpm build:plugin

      # Workspace packages resolve each other through dist/, so build before testing.
      - run: pnpm build

      # lint + format:check + unit/integration tests for every package
      - run: pnpm test

      - run: pnpm typecheck

      - run: pnpm test:coverage

      - name: Performance regression gates
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:performance

      - name: Retrieval quality regression
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:retrieval-quality

      - name: MCP response-size budgets
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:response-size

      - name: Recall evaluator synthetic smoke test
        run: pnpm run test:recall-eval:example

  e2e:
    name: E2E (Chromium + Firefox + WebKit)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Builds production packages, then runs Playwright against an isolated temp SQLite.
      # A failed browser project is rerun once from scratch (scripts/run-e2e.mjs).
      - run: pnpm test:e2e

      # Also keep the first attempt's traces when a rerun made the job pass.
      - if: failure() || hashFiles('test-results/*-rerun-*/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
