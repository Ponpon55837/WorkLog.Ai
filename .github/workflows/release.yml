name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Decide whether the tagged commit already passed the full CI on main. Any doubt means the full checks run.
  verify:
    name: Detect verified commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - name: Look up a successful CI run for this exact commit
        id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          echo "verified=false" >> "$GITHUB_OUTPUT"
          # Latest completed CI run for this commit, pushed to main, concluded success.
          run_id=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&branch=main&status=completed&per_page=100" \
            | jq -r '[.workflow_runs[] | select(.head_sha == env.SHA and .head_branch == "main" and .event == "push" and .conclusion == "success" and .head_repository.full_name == env.REPO)] | sort_by(.run_number) | last | .id // empty') || run_id=""
          if [ -z "$run_id" ]; then
            echo "No successful CI run on main for $SHA; running the full checks."
            exit 0
          fi
          # Every job that covers a release check must itself have succeeded in that run.
          required='["Quality (ubuntu-latest)","Quality (windows-latest)","Quality (macos-latest)","E2E (chromium)","E2E (firefox)","E2E (webkit)","E2E (Chromium + Firefox + WebKit)"]'
          ok=$(gh api "repos/$REPO/actions/runs/$run_id/jobs?filter=latest&per_page=100" \
            | jq -r --argjson required "$required" '[.jobs[] | select(.conclusion == "success") | .name] as $passed | (($required - $passed) | length) == 0') || ok=""
          if [ "$ok" = "true" ]; then
            echo "CI run $run_id covers every release check for $SHA; skipping the duplicate checks."
            echo "verified=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI run $run_id is missing a required successful job; running the full checks."
          fi

  # Always re-check advisories for production dependencies: they change after CI ran.
  audit:
    name: Production dependency audit (verified commit)
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.verified == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    if: needs.verify.outputs.verified != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        if: matrix.os == 'ubuntu-latest'
        run: pnpm audit --prod --audit-level high
      - run: pnpm build
      # The coverage run executes the same test files as pnpm test, so each OS runs the suite once:
      # Ubuntu runs lint + format:check + coverage, Windows and macOS run pnpm test (lint + format:check + tests).
      - name: Lint and format
        if: matrix.os == 'ubuntu-latest'
        run: pnpm lint && pnpm format:check
      - name: Unit and integration tests
        if: matrix.os != 'ubuntu-latest'
        run: pnpm test
      - run: pnpm typecheck
      - name: Unit and integration tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test:coverage
      - name: Performance regression gates
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:performance
      - name: Retrieval quality regression
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:retrieval-quality
      - name: MCP response-size budgets
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run test:response-size
      - name: Recall evaluator synthetic smoke test
        run: pnpm run test:recall-eval:example

  # One job per browser so the three Playwright projects run in parallel and alongside the quality matrix.
  e2e-browser:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: verify
    if: needs.verify.outputs.verified != 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm test:e2e
        env:
          E2E_PROJECTS: ${{ matrix.browser }}
      - if: failure() || hashFiles('test-results/*-rerun-*/**') != ''
        uses: actions/upload-artifact@v7
        with:
          name: release-playwright-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [verify, audit, quality, e2e-browser]
    # Either every check ran and passed, or the commit was verified and only the fast audit ran. Never publish on cancelled, failed or ambiguous results.
    if: >-
      ${{ !cancelled() && needs.verify.result == 'success' && (
      (needs.verify.outputs.verified == 'true' && needs.audit.result == 'success' && needs.quality.result == 'skipped' && needs.e2e-browser.result == 'skipped') ||
      (needs.verify.outputs.verified != 'true' && needs.quality.result == 'success' && needs.e2e-browser.result == 'success')) }}
    permissions:
      contents: write
    steps:
      # Check out the exact commit the verify / quality / E2E jobs checked, not whatever the tag points at now, and keep
      # the write-scoped token out of .git/config while dependencies install and build scripts run.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the tag still points at the verified commit
        shell: bash
        run: |
          set -euo pipefail
          tagged="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "Tag $GITHUB_REF_NAME now points at $tagged, not the verified commit $GITHUB_SHA; refusing to publish." >&2
            exit 1
          fi
      - name: Prepare matching release notes
        id: release
        run: node scripts/prepare-release.mjs
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - name: Build source archives
        shell: bash
        run: |
          set -euo pipefail
          archive_root="work-intelligence-${GITHUB_REF_NAME}/"
          git archive --format=tar --prefix="$archive_root" "$GITHUB_SHA" | gzip -n > "$RUNNER_TEMP/${GITHUB_REF_NAME}.tar.gz"
          git archive --format=zip --prefix="$archive_root" --output="$RUNNER_TEMP/${GITHUB_REF_NAME}.zip" "$GITHUB_SHA"
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the plugin and Claude Desktop extension
        run: pnpm build:plugin
      # The standalone package serves the built Web UI, so it needs the workspace build first.
      - name: Build the standalone package
        run: pnpm build && pnpm build:standalone
      - name: Smoke-test the standalone tarball that will be uploaded
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/smoke-standalone.mjs --tarball "dist/standalone/work-intelligence-$RELEASE_VERSION.tgz"
      - name: Write SHA-256 checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=(
            "$RUNNER_TEMP/$GITHUB_REF_NAME.tar.gz"
            "$RUNNER_TEMP/$GITHUB_REF_NAME.zip"
            "dist/plugin/work-intelligence-plugin-$RELEASE_VERSION.zip"
            "dist/plugin/work-intelligence-$RELEASE_VERSION.mcpb"
            "dist/standalone/work-intelligence-$RELEASE_VERSION.tgz"
          )
          # One "<hash>  <file name>" line per asset, readable by sha256sum -c and shasum -a 256 -c.
          for asset in "${assets[@]}"; do
            (cd "$(dirname "$asset")" && sha256sum "$(basename "$asset")")
          done > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_NOTES_FILE: ${{ steps.release.outputs.release_notes_file }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "Work Intelligence $RELEASE_VERSION"
          --notes-file "$RELEASE_NOTES_FILE"
          "$RUNNER_TEMP/$GITHUB_REF_NAME.tar.gz"
          "$RUNNER_TEMP/$GITHUB_REF_NAME.zip"
          "dist/plugin/work-intelligence-plugin-$RELEASE_VERSION.zip"
          "dist/plugin/work-intelligence-$RELEASE_VERSION.mcpb"
          "dist/standalone/work-intelligence-$RELEASE_VERSION.tgz"
          "$RUNNER_TEMP/SHA256SUMS.txt"
