name: Desktop smoke

# Starts the real Electron shell with a real runtime on each platform. Kept apart from ci.yml so the regular jobs never
# download or start Electron; it only runs when something the desktop App is built from changes.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/desktop-core/**"
      - "packages/agent-setup/**"
      - "packages/shared/**"
      - "packages/schema/**"
      - "apps/server/**"
      - "packages/storage/**"
      - "apps/web/**"
      - "apps/mcp/**"
      - "packages/core/**"
      - "packages/project-policy/**"
      - "packages/ui-tokens/**"
      - "scripts/desktop-runtime-spike/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/desktop-smoke.yml"
  workflow_dispatch:

concurrency:
  group: desktop-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # V1 ships on Windows and macOS; Linux is kept as a regression check (it runs under xvfb).
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.16.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The Electron postinstall is disabled in pnpm-workspace.yaml, so this downloads no binary.
      - run: pnpm install --frozen-lockfile

      # The Electron binary is the one large download; it is cached per OS and per pinned Electron version.
      - name: Cache the Electron binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/electron/Cache' || runner.os == 'macOS' && '~/Library/Caches/electron' || '~/.cache/electron' }}
          key: electron-${{ runner.os }}-45.3.2

      # The runtime builder packages the built server and Web UI.
      - run: pnpm build

      # The backend's heavy transfers run in a child process: how long the fork takes to answer, and whether import,
      # preview and export memory stays bounded as the file grows (synthetic data, about a minute).
      - name: Background worker start and streamed transfer memory
        run: |
          node packages/storage/bench/worker-cold-start.bench.mjs 15 --check
          node apps/server/bench/project-transfer.bench.mjs --check --sizes=10,40

      - name: Display server for Electron (Linux)
        if: runner.os == 'Linux'
        run: command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)

      # Downloads the Electron binary (the only step that does), lays out a runtime, runs Playwright. On Linux the script
      # wraps Playwright in `xvfb-run -a` because no DISPLAY is set.
      - name: Desktop smoke test
        run: pnpm test:desktop-smoke

      # Synthetic-data measurements of cold start, the repair window, quit and idle memory (performance.spec.ts),
      # kept for every run, green or red, so a trend across commits can be read.
      - name: Upload the desktop performance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-perf-${{ matrix.os }}
          path: apps/desktop/perf-results/desktop-perf-*.json
          if-no-files-found: warn
          retention-days: 30

      # Real-Electron screenshots of every tab (light and dark), two languages and the blocking and first-run states, under
      # apps/desktop/screenshots/<platform>/ (screenshots.spec.ts prints each path). For review; nothing is compared.
      - name: Upload the desktop screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-screenshots-${{ matrix.os }}
          path: apps/desktop/screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the report and the main-process log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7
