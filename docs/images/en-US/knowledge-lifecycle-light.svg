<svg xmlns="http://www.w3.org/2000/svg" width="640" height="336" viewBox="0 0 640 336" role="img" aria-labelledby="title desc" xml:lang="en-US">
  <title id="title">Review and maintain project Knowledge</title>
  <desc id="desc">After acceptance, changed files or contradictory evidence can prompt a user-requested review. The reviewer can confirm, replace or archive.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#4f5862" stroke-width="1.5"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, Microsoft JhengHei, Arial, sans-serif">
    <rect x="1" y="1" width="638" height="334" rx="16" fill="#eef0f3" stroke="#c9d0d8" />
    <rect x="20" y="17" width="250" height="83" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <path transform="translate(34 31)" d="M5 2h10l4 4v16H5z M14 2v6h5 M8 12h8 M8 16h6" fill="none" stroke="#0754ae" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="68" y="51" fill="#24292f" font-size="23" font-weight="650" text-anchor="start">Candidate</text>
    <text x="35" y="82" fill="#4f5862" font-size="20" font-weight="400" text-anchor="start">Cite a source Session</text>
    <rect x="370" y="17" width="250" height="83" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <path transform="translate(384 31)" d="M2 4q5-2 10 1 5-3 10-1v15q-5-2-10 1-5-3-10-1z M12 5v15" fill="none" stroke="#0a5f6b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="418" y="51" fill="#24292f" font-size="23" font-weight="650" text-anchor="start">Knowledge</text>
    <text x="385" y="82" fill="#4f5862" font-size="20" font-weight="400" text-anchor="start">Available for recall</text>
    <text x="320" y="44" fill="#0a5f6b" font-size="19" font-weight="600" text-anchor="middle">Accept</text>
    <path d="M275 65h86" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M494 105v31" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="20" y="144" width="600" height="99" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <path transform="translate(36 159)" d="M5 22V3q4-3 8 0t8 0v11q-4 3-8 0t-8 0" fill="none" stroke="#744c00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="73" y="178" fill="#24292f" font-size="24" font-weight="650" text-anchor="start">Review on request</text>
    <text x="36" y="214" fill="#4f5862" font-size="20" font-weight="400" text-anchor="start">A file changed or a later Session reported a contradiction.</text>
    <path d="M320 247v25" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M320 258H112v14" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M320 258h208v14" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="20" y="280" width="184" height="39" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <text x="112" y="307" fill="#24292f" font-size="22" font-weight="650" text-anchor="middle">Confirm</text>
    <rect x="228" y="280" width="184" height="39" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <text x="320" y="307" fill="#24292f" font-size="22" font-weight="650" text-anchor="middle">Replace</text>
    <rect x="436" y="280" width="184" height="39" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <text x="528" y="307" fill="#24292f" font-size="22" font-weight="650" text-anchor="middle">Archive</text>
  </g>
</svg>
