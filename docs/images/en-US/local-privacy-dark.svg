<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc" xml:lang="en-US">
  <title id="title">Where project data travels</title>
  <desc id="desc">Dashboard and Agent host access SQLite through separate local services. The Agent host may send results to a remote model.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#9198a1" stroke-width="1.5"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, Microsoft JhengHei, Arial, sans-serif">
    <rect x="1" y="1" width="638" height="378" rx="16" fill="#0d1117" stroke="#30363d" />
    <rect x="15" y="12" width="610" height="276" rx="12" fill="#11161d" stroke="#30363d" />
    <text x="31" y="42" fill="#e6edf3" font-size="23" font-weight="650" text-anchor="start">On your computer</text>
    <rect x="32" y="58" width="280" height="53" rx="10" fill="#151b23" stroke="#30363d" />
    <path transform="translate(47 72)" d="M2 3h20v14H2z M12 17v4 M7 21h10" fill="none" stroke="#4493f8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="83" y="92" fill="#e6edf3" font-size="23" font-weight="650" text-anchor="start">Dashboard</text>
    <rect x="328" y="58" width="280" height="53" rx="10" fill="#151b23" stroke="#30363d" />
    <path transform="translate(343 72)" d="M8 6l-6 6 6 6 M16 6l6 6-6 6 M14 3l-4 18" fill="none" stroke="#4493f8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="379" y="92" fill="#e6edf3" font-size="23" font-weight="650" text-anchor="start">Agent host</text>
    <path d="M172 116v40" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="188" y="142" fill="#9198a1" font-size="18" font-weight="550" text-anchor="start">REST API</text>
    <path d="M468 116v40" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
    <text x="484" y="142" fill="#9198a1" font-size="18" font-weight="550" text-anchor="start">MCP · stdio</text>
    <rect x="32" y="163" width="280" height="43" rx="10" fill="#151b23" stroke="#30363d" />
    <text x="172" y="191" fill="#e6edf3" font-size="22" font-weight="550" text-anchor="middle">Local web service</text>
    <rect x="328" y="163" width="280" height="43" rx="10" fill="#151b23" stroke="#30363d" />
    <text x="468" y="191" fill="#e6edf3" font-size="22" font-weight="550" text-anchor="middle">MCP server</text>
    <path d="M172 210v17h146" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round"/>
    <path d="M468 210v17H320v13" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="144" y="245" width="352" height="34" rx="10" fill="#151b23" stroke="#30363d" />
    <text x="320" y="269" fill="#e6edf3" font-size="21" font-weight="600" text-anchor="middle">SQLite · project records</text>
    <path d="M609 84h19v260H239" fill="none" stroke="#9198a1" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
    <text x="30" y="318" fill="#9198a1" font-size="20" font-weight="400" text-anchor="start">The host may send tool results to a remote model.</text>
    <path transform="translate(35 339)" d="M6 19a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11z" fill="none" stroke="#9198a1" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="75" y="360" fill="#e6edf3" font-size="22" font-weight="650" text-anchor="start">Remote model</text>
  </g>
</svg>
