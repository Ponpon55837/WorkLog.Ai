<svg xmlns="http://www.w3.org/2000/svg" width="640" height="252" viewBox="0 0 640 252" role="img" aria-labelledby="title desc" xml:lang="zh-TW">
  <title id="title">透過本機專案記錄交接</title>
  <desc id="desc">Codex 保存 Session，Claude Code 讀取同一筆記錄，接手未完成的測試。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l8 4-8 4" fill="none" stroke="#4f5862" stroke-width="1.5"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang TC, Microsoft JhengHei, Arial, sans-serif">
    <rect x="1" y="1" width="638" height="250" rx="16" fill="#eef0f3" stroke="#c9d0d8" />
    <rect x="20" y="17" width="260" height="86" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <path transform="translate(34 31)" d="M8 6l-6 6 6 6 M16 6l6 6-6 6 M14 3l-4 18" fill="none" stroke="#0754ae" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="68" y="51" fill="#24292f" font-size="23" font-weight="650" text-anchor="start">Codex</text>
    <text x="35" y="82" fill="#4f5862" font-size="20" font-weight="400" text-anchor="start">保存報表修正</text>
    <rect x="360" y="17" width="260" height="86" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <path transform="translate(374 31)" d="M8 6l-6 6 6 6 M16 6l6 6-6 6 M14 3l-4 18" fill="none" stroke="#0754ae" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="408" y="51" fill="#24292f" font-size="23" font-weight="650" text-anchor="start">Claude Code</text>
    <text x="375" y="82" fill="#4f5862" font-size="20" font-weight="400" text-anchor="start">接手待驗證案例</text>
    <path d="M150 107v38" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M490 146v-37" fill="none" stroke="#4f5862" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="20" y="153" width="600" height="82" rx="10" fill="#fbfcfd" stroke="#c9d0d8" />
    <path transform="translate(36 166)" d="M5 2h10l4 4v16H5z M14 2v6h5 M8 12h8 M8 16h6" fill="none" stroke="#0a5f6b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="74" y="186" fill="#24292f" font-size="24" font-weight="650" text-anchor="start">同一個專案的 Session</text>
    <text x="36" y="218" fill="#4f5862" font-size="20" font-weight="400" text-anchor="start">UTC 測試已通過。日光節約時間切換日仍待驗證。</text>
  </g>
</svg>
